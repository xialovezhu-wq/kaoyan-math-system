<section id="__FLOW_ID__" aria-label="__TITLE__">
  <div class="mapping-headings"><span>基本方法</span><span>解题过程</span></div>
  <ul class="mapping-tree" role="list">__ROWS__</ul>
</section>
<style>
  #__FLOW_ID__ {
    --columns: minmax(0, 30%) 2.1rem minmax(0, 1fr);
    --indent: .91rem;
    --joint: .37rem;
    --row-gap: .44rem;
    --arrow-y: 1.31rem;
    --branch-color: var(--border, currentColor);
    --arrow-color: var(--muted-foreground, currentColor);
    container-type: inline-size;
    color: var(--foreground, currentColor);
  }
  #__FLOW_ID__ .mapping-headings,

  #__FLOW_ID__ .mapping-tree ul { margin: 0; padding: 0; list-style: none; }
  #__FLOW_ID__ .mapping-tree li {
    --step-inset: calc(var(--indent) * var(--depth));
    --branch-x: calc(var(--step-inset) - var(--indent) + var(--joint));

    margin: 0;
    padding: 0;

  }
  #__FLOW_ID__ .mapping-tree ul > li:last-child::before { bottom: auto; height: var(--branch-y); }
  #__FLOW_ID__ .mapping-tree ul > li::after {
    content: ""; position: absolute; top: var(--branch-y); inset-inline-start: var(--branch-x);

  }

  #__FLOW_ID__ .mapping-arrow {

  }

  }
  #__FLOW_ID__ .mapping-process {

  #__FLOW_ID__ .mapping-chevron {
    width: .39rem; height: .39rem; justify-self: center; margin-top: -.18rem;

  #__FLOW_ID__ .mapping-process[open] .mapping-chevron { margin-top: .18rem; transform: rotate(225deg); }
  #__FLOW_ID__ .mapping-detail {
    display: grid; gap: .64rem; min-width: 0; padding: .6rem .62rem .66rem;
    border-block-start: 1px solid var(--branch-color); overflow-wrap: anywhere;
  }

    #__FLOW_ID__ .mapping-headings { grid-template-columns: auto 1fr; gap: .45rem; }
    #__FLOW_ID__ .mapping-headings > :last-child { grid-column: auto; }
    #__FLOW_ID__ .mapping-headings > :last-child::before { content: "→"; margin-inline-end: .45rem; }
    #__FLOW_ID__ .mapping-row { grid-template-columns: minmax(0, 1fr); }
    #__FLOW_ID__ .mapping-arrow {
      width: 1px; height: .69rem; margin: .08rem 0 .24rem calc(var(--step-inset) + 1.1rem);
    }
    #__FLOW_ID__ .mapping-arrow::after {
      top: auto; bottom: 0; inset-inline-end: 50%; transform: translateX(50%) rotate(135deg);
    }
    #__FLOW_ID__ .mapping-process { margin-inline-start: var(--step-inset); }
  }
</style>
