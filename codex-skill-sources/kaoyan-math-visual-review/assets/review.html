<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$heading</title>
<style>
:root {
  color-scheme: dark;
  --page: #101821;
  --card: #162331;
  --text: #edf1f5;
  --muted: #bdc9d2;
  --accent: #91dfcc;
  --line: #3a5263;
  --node: #1e3140;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 5rem; }
body { margin: 0; background: var(--page); color: var(--text);
  font: 16px/1.6 "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
main { max-width: 930px; margin: auto; padding: 0 clamp(15px, 4vw, 44px) 4rem; }
.page-header { padding: clamp(1.45rem, 4vw, 2.65rem) 0 1rem; }
h1, h2, h3, h4, p, figure, dl, dd { margin: 0; }
h1 { font-size: clamp(1.65rem, 5vw, 2.6rem); line-height: 1.2; font-weight: 650; }
h2 { font-size: 1.16rem; margin: 1.35rem 0 .66rem; }
h3 { font-size: 1.18rem; line-height: 1.35; }
.page-header p, .source { color: var(--muted); font-size: .88rem; }
.page-header p { margin-top: .32rem; }
.filters { position: sticky; z-index: 2; top: 0; display: flex; flex-wrap: wrap; gap: .38rem;
  background: var(--page); border-block: 1px solid var(--line); padding: .55rem 0; }
.filters a { padding: .33rem .68rem; color: var(--text); border: 1px solid var(--line);
  text-decoration: none; border-radius: 5px; font-size: .88rem; }
.filters a[aria-current] { border-color: var(--accent); background: var(--accent); color: #142a2a; }
.filters a:focus-visible, .equation:focus-visible { outline: 2px solid #efbd79; outline-offset: 3px; }
.card { padding: clamp(.86rem, 2vw, 1.35rem); margin: 0 0 .85rem; background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; }
.card-heading { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
  margin-bottom: .62rem; column-gap: 1rem; row-gap: .2rem; }
.question { background: #f9fafb; border-radius: 4px; color: #17212c; overflow-wrap: anywhere; }
.question img { display: block; width: auto; max-width: 100%; height: auto; border-radius: inherit; }
.question-parts { display: grid; grid-template-columns: max-content minmax(0,1fr); gap: .5rem .8rem; padding: .85rem; }
.question-parts dt { font-weight: 650; }
.card-part { margin-top: .96rem; }
.card-part h4 { font-size: .92rem; color: var(--accent); margin-bottom: .42rem; }
.study-list { list-style: none; padding: 0; margin: 0; }
.study-list > li + li { margin-top: .4rem; }
.condition { color: var(--muted); font-size: .91em; margin-inline-start: .2rem; }
.equation { padding-block: .12rem; overflow-x: auto; }
.equation math[display=block] { margin: 0; text-align: start; }
math { font-size: 1.03em; }
.formulas { padding-top: .72rem; border-top: 1px solid var(--line); }
.mapped { --method-columns: minmax(0, 29%) 2.4rem minmax(0, 1fr); }
.method-headings, .mapped .method-row { display: grid; grid-template-columns: var(--method-columns); }
.method-headings { margin-bottom: .42rem; align-items: baseline; }
.method-headings h4 { margin: 0; }
.method-headings > span { grid-column: 3; color: var(--accent); font-size: .92rem; font-weight: 650; }
.method-tree {
  --tree-indent: 1.05rem;
  --tree-line-offset: .42rem;
  --step-gap: .46rem;
  --arrow-height: 1.02rem;
}
.method-tree, .method-tree ul { list-style: none; margin: 0; padding: 0; }
.method-tree li {
  --step-inset: calc(var(--depth) * var(--tree-indent));
  --branch-start: calc(var(--step-inset) - var(--tree-indent) + var(--tree-line-offset));
  --branch-end: calc(var(--step-gap) + var(--arrow-height));
  position: relative;
}
.method-tree ul > li { padding-top: var(--step-gap); }
.method-tree ul > li::before { position: absolute; content: ""; top: 0; bottom: 0;
  inset-inline-start: var(--branch-start); border-inline-start: 1px solid #688598; }
.method-tree ul > li:last-child::before { bottom: auto; height: var(--branch-end); }
.method-tree ul > li::after { position: absolute; content: ""; top: var(--branch-end);
  inset-inline-start: var(--branch-start); width: calc(var(--tree-indent) - var(--tree-line-offset));
  border-top: 1px solid #688598; }
.method-step { display: flex; flex-direction: column; align-items: flex-start; min-width: 0;
  padding-inline-start: var(--step-inset); }
.method-tree li:has(> ul) > .method-row > .method-step::after {
  content: ""; flex: 1; margin-inline-start: var(--tree-line-offset);
  border-inline-start: 1px solid #688598;
}
.node { display: inline-block; max-width: 100%; padding: .18rem .55rem;
  border: 1px solid var(--line); border-radius: 4px; background: var(--node);
  overflow-wrap: anywhere; font-size: .95rem; line-height: 1.47; }
.method-tree > li > .method-row .node { color: var(--accent); font-weight: 600; }
.mapped .node { align-self: stretch; padding-block: .28rem; }
.step-arrow { position: relative; align-self: start; height: 1px;
  margin: var(--arrow-height) .25rem 0; color: var(--accent); background: currentColor; }
.step-arrow::after { content: ""; position: absolute; width: .4rem; height: .4rem;
  inset-inline-end: 0; top: 50%; border: solid currentColor; border-width: 1px 1px 0 0;
  transform: translateY(-50%) rotate(45deg); }
.solution-box { min-width: 0; padding: .32rem .67rem; border: 1px solid #55787c; border-radius: 5px;
  background: #192b36; overflow-wrap: anywhere; font-size: .94rem; }
.solution-box > * + * { margin-top: .16rem; }
@media (max-width: 640px) {
  .method-tree { --tree-indent: .82rem; --tree-line-offset: .29rem; }
  .mapped .method-row { grid-template-columns: minmax(0, 1fr); }
  .method-headings { grid-template-columns: auto 1fr; column-gap: .5rem; }
  .method-headings > span { grid-column: auto; }
  .method-headings > span::before { content: "→"; margin-inline-end: .5rem; }
  .step-arrow { height: .67rem; width: 1px; margin: .08rem 0 .2rem calc(var(--step-inset) + 1.1rem); }
  .step-arrow::after { top: auto; bottom: 0; inset-inline-end: 50%;
    transform: translateX(50%) rotate(135deg); }
  .solution-box { margin-inline-start: var(--step-inset); }
}
@media (max-width: 560px) {
  .filters { position: static; }
}
</style>
</head>
<body>
<main>
<header class="page-header">
  <h1>$heading</h1>
  <p>$year 年 · 共 $count 道</p>
</header>
<nav class="filters" aria-label="复盘专题">
$filters
</nav>
<div id="topics">
$sections
</div>
</main>
<script>
const controls = [...document.querySelectorAll('[data-filter]')];
const topics = [...document.querySelectorAll('[data-topic]')];
for (const link of controls) {
  link.addEventListener('click', () => {
    for (const topic of topics) {
      topic.hidden = link.dataset.filter !== 'all' && topic.dataset.topic !== link.dataset.filter;
    }
    for (const control of controls) {
      if (control === link) control.setAttribute('aria-current', 'true');
      else control.removeAttribute('aria-current');
    }
  });
}
for (const equation of document.querySelectorAll('.equation')) {
  if (equation.scrollWidth > equation.clientWidth && equation.clientWidth > 0) {
    equation.tabIndex = 0;
    equation.setAttribute('aria-label','可横向滚动的公式');
  }
}
</script>
</body>
</html>
